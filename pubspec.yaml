name: cart_pal
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^6.3.2
  go_router: ^16.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  google_mobile_ads: ^6.0.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo.png"
  web:
    generate: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/Logo.png
  android: true
  ios: true
  web: true
